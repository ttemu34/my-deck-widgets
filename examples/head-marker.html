<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>my-deck-widgets — AnimationWidget head-marker + auto-rotate demo</title>
<script src="https://unpkg.com/deck.gl@9/dist.min.js"></script>
<script src="/dist/bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #e6edf3;
    font-family: ui-monospace, Menlo, monospace; }
  #deck { position: absolute; inset: 0; }
  #note { position: absolute; left: 16px; top: 14px; z-index: 2; font-size: 12px; color: #7d8b99; }
  #note b { color: #34e0c4; }
  #err { position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    color: #f0765c; font-size: 13px; padding: 24px; }
</style>
</head>
<body>
<div id="deck"></div>
<div id="note"><b>AnimationWidget</b> — comet TripsLayer + head marker (ScatterplotLayer) + auto-rotate</div>
<div id="err"></div>
<script>
  (function () {
    const fail = (msg) => { const e = document.getElementById('err'); e.textContent = msg; e.style.display = 'grid'; };
    if (!window.deck || !deck.Deck || !deck.TripsLayer || !deck.ScatterplotLayer) return fail('deck.gl failed to load from the CDN.');
    if (!window.myDeckWidgets || !myDeckWidgets.AnimationWidget)
      return fail('bundle not found — run `npm run build` (or `npm run dev`) and reload.');

    const { Deck } = deck;
    const { AnimationWidget } = myDeckWidgets;

    const palette = [[80, 140, 240], [240, 118, 92], [200, 120, 240]];
    const MAX_TIME = 3600;
    const N_POINTS = 120;
    const makeTrack = (originLng, originLat, seed) => {
      const path = [];
      const timestamps = [];
      for (let i = 0; i < N_POINTS; i++) {
        const t = (i / (N_POINTS - 1)) * MAX_TIME;
        const angle = seed + i * 0.35;
        path.push([
          originLng + Math.cos(angle) * 0.05 + i * 0.002,
          originLat + Math.sin(angle * 1.3) * 0.05
        ]);
        timestamps.push(t);
      }
      return { path, timestamps };
    };

    const tracks = [
      { ...makeTrack(-122.4, 37.78, 0), color: palette[0] },
      { ...makeTrack(-122.42, 37.76, 2), color: palette[1] },
      { ...makeTrack(-122.38, 37.80, 4), color: palette[2] }
    ];

    // Head-marker rows carry the SAME path/timestamps a TripsLayer would (via
    // geometry.coordinates / times, matching pathField/timestampField below),
    // plus a `position` field the widget keeps refreshed each tick.
    const headData = tracks.map((tr) => ({
      geometry: { coordinates: tr.path },
      times: tr.timestamps,
      position: tr.path[0],
      color: tr.color
    }));

    const tripsLayer = new deck.TripsLayer({
      id: 'trips',
      data: tracks,
      getPath: (d) => d.path,
      getTimestamps: (d) => d.timestamps,
      getColor: (d) => d.color,
      getWidth: 4,
      widthMinPixels: 3,
      widthUnits: 'pixels',
      capRounded: true,
      jointRounded: true,
      fadeTrail: true,
      trailLength: 400,
      currentTime: 0
    });

    const headLayer = new deck.ScatterplotLayer({
      id: 'head',
      data: headData,
      getPosition: (d) => d.position,
      getFillColor: (d) => d.color,
      getRadius: 8,
      radiusUnits: 'pixels',
      stroked: true,
      getLineColor: [255, 255, 255],
      getLineWidth: 1.5,
      lineWidthUnits: 'pixels',
      billboard: true,
      pickable: false
    });

    window.deckInstance = new Deck({
      parent: document.getElementById('deck'),
      initialViewState: { longitude: -122.4, latitude: 37.78, zoom: 11, bearing: 0, pitch: 0 },
      controller: true,
      layers: [tripsLayer, headLayer],
      widgets: [
        window.animWidget = new AnimationWidget({
          minTime: 0,
          maxTime: MAX_TIME,
          durationMs: 8000,
          loop: true,
          autoplay: true,
          headLayerIds: ['head'],
          autoRotateSpeed: 20
        })
      ]
    });
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>my-deck-widgets — AnimationWidget demo</title>
<!-- deck.gl provides the global `deck` that the bundle externalises against -->
<script src="https://unpkg.com/deck.gl@9/dist.min.js"></script>
<!-- the locally-built bundle: window.myDeckWidgets -->
<script src="/dist/bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #e6edf3;
    font-family: ui-monospace, Menlo, monospace; }
  #deck { position: absolute; inset: 0; }
  #note { position: absolute; left: 16px; top: 14px; z-index: 2; font-size: 12px; color: #7d8b99; }
  #note b { color: #34e0c4; }
  #err { position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    color: #f0765c; font-size: 13px; padding: 24px; }
</style>
</head>
<body>
<div id="deck"></div>
<div id="note"><b>AnimationWidget</b> — TripsLayer playback with play/pause + scrub, bottom-left</div>
<div id="err"></div>
<script>
  (function () {
    const fail = (msg) => { const e = document.getElementById('err'); e.textContent = msg; e.style.display = 'grid'; };
    if (!window.deck || !deck.Deck || !deck.TripsLayer) return fail('deck.gl failed to load from the CDN.');
    if (!window.myDeckWidgets || !myDeckWidgets.AnimationWidget)
      return fail('bundle not found — run `npm run build` (or `npm run dev`) and reload.');

    const { Deck } = deck;
    const { AnimationWidget } = myDeckWidgets;

    // Synthetic subjects: each is a wavy path over [0, 3600] seconds, mirroring
    // the shape of the real trips data (path + parallel timestamps + color).
    const palette = [[80, 140, 240], [240, 118, 92], [200, 120, 240]];
    const MAX_TIME = 3600;
    const N_POINTS = 120;
    const makeTrack = (originLng, originLat, seed) => {
      const path = [];
      const timestamps = [];
      for (let i = 0; i < N_POINTS; i++) {
        const t = (i / (N_POINTS - 1)) * MAX_TIME;
        const angle = seed + i * 0.35;
        path.push([
          originLng + Math.cos(angle) * 0.05 + i * 0.002,
          originLat + Math.sin(angle * 1.3) * 0.05
        ]);
        timestamps.push(t);
      }
      return { path, timestamps };
    };

    const data = [
      { ...makeTrack(-122.4, 37.78, 0), color: palette[0] },
      { ...makeTrack(-122.42, 37.76, 2), color: palette[1] },
      { ...makeTrack(-122.38, 37.80, 4), color: palette[2] }
    ];

    const tripsLayer = new deck.TripsLayer({
      id: 'trips',
      data,
      getPath: (d) => d.path,
      getTimestamps: (d) => d.timestamps,
      getColor: (d) => d.color,
      getWidth: 4,
      widthMinPixels: 3,
      widthUnits: 'pixels',
      capRounded: true,
      jointRounded: true,
      fadeTrail: true,
      trailLength: 400,
      currentTime: 0
    });

    new Deck({
      parent: document.getElementById('deck'),
      initialViewState: { longitude: -122.4, latitude: 37.78, zoom: 11 },
      controller: true,
      layers: [tripsLayer],
      widgets: [
        new AnimationWidget({
          minTime: 0,
          maxTime: MAX_TIME,
          durationMs: 8000,
          loop: true,
          autoplay: true
        })
      ]
    });
  })();
</script>
</body>
</html>
